/* V1.7: make every button interaction feel like a real service round-trip */
button{position:relative}
button.uiPending{
  cursor:wait !important;
  transform:translateY(1px);
  box-shadow:none !important;
}
button.uiPending > *{opacity:.55}
button.uiPending::after{
  content:"";
  position:absolute;
  width:13px;height:13px;
  left:50%;top:50%;
  margin:-7px 0 0 -7px;
  border:2px solid rgba(80,100,125,.28);
  border-top-color:#1769e0;
  border-radius:50%;
  animation:uiSpin .55s linear infinite;
  pointer-events:none;
}
.btn.primary.uiPending::after,
.btn.success.uiPending::after,
.btn.warn.uiPending::after,
.btn.danger.uiPending::after{
  border-color:rgba(255,255,255,.35);
  border-top-color:#fff;
}
@keyframes uiSpin{to{transform:rotate(360deg)}}

/* V1.7 global button latency simulator.
   All user button clicks wait ~500 ms before the original handler runs.
   This is UI-only; it does not imply a real backend request. */
const __uiDelayBypass = new WeakSet();
const __uiDelayPending = new WeakSet();

document.addEventListener('click', function(ev){
  const btn = ev.target.closest && ev.target.closest('button');
  if(!btn) return;

  // IDE navigation controls must react immediately.
  if(btn.closest('.dockTools,.specToolbar,.sourceTabs')) return;

  // Let the delayed synthetic click execute normally.
  if(__uiDelayBypass.has(btn)){
    __uiDelayBypass.delete(btn);
    return;
  }

  // Ignore repeated clicks while the first one is waiting.
  if(__uiDelayPending.has(btn)){
    ev.preventDefault();
    ev.stopImmediatePropagation();
    return;
  }

  // Respect buttons that were already disabled by the app.
  if(btn.disabled) return;

  ev.preventDefault();
  ev.stopImmediatePropagation();

  __uiDelayPending.add(btn);
  btn.classList.add('uiPending');
  btn.setAttribute('aria-busy','true');

  setTimeout(function(){
    __uiDelayPending.delete(btn);
    btn.classList.remove('uiPending');
    btn.removeAttribute('aria-busy');

    // The page may have re-rendered. Only replay if this exact button still exists.
    if(!document.documentElement.contains(btn)) return;

    __uiDelayBypass.add(btn);
    btn.click();
  }, 500);
}, true);

  if(['RX Decoder','PHY'].includes(name)){toast(name+' is fixed in this demo');return;}
  state.myDesign=state.myDesign.filter(x=>x!==name);state.myDesignSaved=false;renderArch();

function moveDesignBlock(name,dir){

  const a=[...state.myDesign];[a[i],a[j]]=[a[j],a[i]];
  state.myDesign=a;state.myDesignSaved=false;renderArch();
}

const rtlSources = {
"credit_manager.sv": `module credit_manager #(
  parameter int MAX_CREDIT = 56
)(
  input  logic       clk,
  input  logic       reset,
  input  logic       fct_pulse,
  input  logic       consume_char,
  output logic [5:0] tx_credit,
  output logic       send_enable
);

always_ff @(posedge clk) begin
  if (reset) begin
    tx_credit <= '0;
  end else begin
    unique case ({fct_pulse, consume_char})
      2'b10:
        tx_credit <= (tx_credit > 48) ? 56 : tx_credit + 8;
      2'b01:
        if (tx_credit != 0) tx_credit <= tx_credit - 1;
      default:
        tx_credit <= tx_credit;
    endcase
  end
end

assign send_enable = (tx_credit != 0);

endmodule`,
"tx_fsm.sv": `module tx_fsm (
  input  logic clk,
  input  logic reset,
  input  logic send_req,
  input  logic send_enable,
  output logic consume_char,
  output logic tx_valid
);

typedef enum logic [1:0] {IDLE, SEND, WAIT} tx_state_t;
tx_state_t state, next_state;

always_comb begin
  next_state = state;
  consume_char = 1'b0;
  tx_valid = 1'b0;

  case (state)
    IDLE:
      if (send_req && send_enable) next_state = SEND;
    SEND: begin
      tx_valid = 1'b1;
      consume_char = 1'b1;
      next_state = WAIT;
    end
    WAIT:
      next_state = IDLE;
  endcase
end
endmodule`,
"encoder.sv": `module encoder(
  input logic clk,
  input logic tx_valid,
  input logic [7:0] tx_data,
  output logic dout,
  output logic sout
);
// demo placeholder: SpaceWire character encoder
endmodule`,
"spw_top.sv": `module spw_top(...);
// RX Decoder -> Credit Manager -> TX FSM -> Encoder -> PHY
endmodule`
};

function codeWithLines(src){
  const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const lines = src.split('\n');
  const nums = lines.map((_,i)=>i+1).join('\n');
  const code = lines.map((line,i)=>{
    let x=esc(line)
      .replace(/\b(module|endmodule|input|output|logic|parameter|int|always_ff|always_comb|if|else|begin|end|unique|case|endcase|assign|typedef|enum)\b/g,'<span class="kw">$1</span>')
      .replace(/\b(56|48|8|0|1)\b/g,'<span class="num">$1</span>')
      .replace(/\b(tx_credit|send_enable|fct_pulse|consume_char|send_req|tx_valid)\b/g,'<span class="sig">$1</span>');
    if(line.trim().startsWith('//')) x='<span class="com">'+esc(line)+'</span>';
    if(state.rtlFile==='credit_manager.sv' && [16,18,19,27].includes(i+1)) x='<span class="hl">'+x+'</span>';
    return x;
  }).join('\n');
  return `<div class="editorBody"><div class="lineNums">${nums}</div><div class="codeLines">${code}</div></div>`;
}

function runCompilePipeline(forceFail=false){
  if(!state.rtl){toast('먼저 RTL을 Generate 하세요.');return;}
  if(state.compileRunning){toast('Compile job이 이미 실행 중입니다.');return;}
  resetCompilePipeline();
  state.compileRunning=true;
  state.compileResult='running';
  renderRTL();

  const stages=[
    ['queue','[API] POST /jobs/compile -> job-842 queued'],
    ['worker','[RQ] simulation-worker-01 picked job-842'],
    ['docker','[Docker] sandbox spec2rtl-job-842 started (cpu=1, mem=512MB)'],
    ['verilator','[Verilator 5.038] --lint-only rtl/credit_manager.sv rtl/tx_fsm.sv'],
    ['iverilog','[Icarus 12.0] -g2012 -o sim.out rtl/*.sv tb/tb_credit.sv'],
    ['cocotb','[pytest/cocotb] test_credit.py::test_credit_increase ... PASS'],
    ['artifacts','[Artifacts] compile.log, junit.xml, waveform.fst stored']
  ];

  stages.forEach((item,idx)=>{
    setTimeout(()=>{
      const [key,msg]=item;
      state.compilePipeline[key]='running';
      appendCompileLog(msg);
      if(key==='verilator') appendCompileLog('%Warning-demo: no fatal lint issues');
      if(key==='iverilog') appendCompileLog('Compilation finished with 0 errors');
      renderRTL();

      setTimeout(()=>{
        if(forceFail && key==='iverilog'){
          state.compilePipeline[key]='fail';
          appendCompileLog('rtl/credit_manager.sv:19: syntax error (simulated)');
          appendCompileLog('[Worker] job-842 FAILED; container cleanup complete');
          state.compileRunning=false; state.compileResult='fail'; state.failureKind='compile_syntax';
          renderRTL(); toast('Simulated compile failure · Verification > Failure Analysis에서 추적 가능');
          return;
        }
        if(!state.compileRunning) return;
        state.compilePipeline[key]='pass';
        if(key==='artifacts'){
          appendCompileLog('[Docker] container removed --rm');
          appendCompileLog('[API] job-842 status=PASS');
          state.compileRunning=false; state.compileResult='pass';
          state.jobs++;
          toast('Docker compile pipeline PASS');
        }
        renderRTL();
      },380);
    },idx*900);
  });
}

 if(action==='maximize')pane.classList.toggle('maximized');
}
function traceNavigator(req){
 const ordered=[...mvpCatalog.requirements].sort((a,b)=>a.spec.clause.localeCompare(b.spec.clause,undefined,{numeric:true,sensitivity:'base'}));
 const groups=[
  {prefix:'5.4.',label:'5.4 Encoding Layer'},
  {prefix:'5.5.',label:'5.5 Data Link Layer'},
 ];
 const tree=groups.map(group=>`<div class="treeGroup"><div class="treeRow branch"><span class="treeIcon" aria-hidden="true">▾</span><span>${group.label}</span></div>${ordered.filter(r=>r.spec.clause.startsWith(group.prefix)).map(r=>`<div class="treeRow treeIndent selectable ${r.id===req.id?'selected':''}" onclick="selectMvpRequirement('${r.id}')"><span class="docIcon" aria-hidden="true"></span><span class="treeText"><b>§${esc(r.spec.clause)}</b><small>${esc(r.title)}</small></span></div>`).join('')}</div>`).join('');
 return `<aside class="traceNavigator"><div class="dockHead"><strong>TRACE NAVIGATOR</strong></div><div class="traceTree">${tree}</div><div class="traceNavSearch"><input aria-label="Trace filter" placeholder="Filter clause…"></div></aside>`;
}
function changeSpecPage(delta){
 const total=mvpCatalog?.pilot?.spec_total_pages||124,current=mvpSpecPage||1;
 mvpSpecPage=Math.max(1,Math.min(total,current+delta));renderMvp();
}
function adjustSpecZoom(delta){
 mvpSpecZoom=Math.max(.6,Math.min(2.4,Math.round((mvpSpecZoom+delta)*10)/10));
 const page=document.getElementById('specPage'),label=document.getElementById('specZoomValue');if(page)page.style.width=Math.round(mvpSpecZoom*100)+'%';if(label)label.textContent=Math.round(mvpSpecZoom*100)+'%';
}
function handleSpecKey(event){
 if(event.key==='ArrowLeft'||event.key==='PageUp'){event.preventDefault();changeSpecPage(-1)}
 else if(event.key==='ArrowRight'||event.key==='PageDown'){event.preventDefault();changeSpecPage(1)}
 else if(event.key==='+'||event.key==='='){event.preventDefault();adjustSpecZoom(.1)}
 else if(event.key==='-'){event.preventDefault();adjustSpecZoom(-.1)}
}
function traceSpecBody(req){
 const page=mvpSpecPage||req.spec.pdf_pages[0],total=mvpCatalog.pilot.spec_total_pages||124,highlights=page===req.spec.pdf_pages[0]?(req.spec.highlights||[]):[];
 if(mvpCatalog.pilot.spec_available===false)return '<div class="specMissing">Local PDF unavailable<br>See assets/spec/README.md</div>';
 const overlays=highlights.map(h=>`<div class="specHighlight" aria-label="Highlighted trace target" style="left:${h.x}%;top:${h.y}%;width:${h.width}%;height:${h.height}%"></div>`).join('');
 return `<div class="specToolbar" role="toolbar" aria-label="PDF controls"><button type="button" aria-label="Zoom out" title="Zoom out (-)" onclick="adjustSpecZoom(-.1)">−</button><button type="button" aria-label="Zoom in" title="Zoom in (+)" onclick="adjustSpecZoom(.1)">＋</button><span class="specZoom" id="specZoomValue">${Math.round(mvpSpecZoom*100)}%</span><button type="button" aria-label="Previous page" title="Previous page" onclick="changeSpecPage(-1)" ${page<=1?'disabled':''}>‹</button><span class="specPageCount">${page} / ${total}</span><button type="button" aria-label="Next page" title="Next page" onclick="changeSpecPage(1)" ${page>=total?'disabled':''}>›</button></div><div class="specViewport" id="specViewport" tabindex="0" aria-label="PDF page ${page} of ${total}" onkeydown="handleSpecKey(event)"><div class="specPage" id="specPage" style="width:${Math.round(mvpSpecZoom*100)}%"><img src="/api/spec/page?page=${page}" alt="ECSS page ${page}" onload="scrollSpecViewer(${highlights[0]?.y||0})">${overlays}</div></div>`;
}
function sourceBasename(path){return String(path||'').split('/').pop()}
function sourcePane(layer,req){
 const items=req.trace[layer],active=Math.min(sourceTabIndex[layer]||0,items.length-1),item=items[active];
 const tabs=items.map((entry,index)=>{const basename=sourceBasename(entry.file),duplicate=items.filter(candidate=>sourceBasename(candidate.file)===basename).length>1,label=duplicate?`${basename} · ${entry.symbol}`:basename;return `<button class="sourceTab ${index===active?'active':''}" role="tab" tabindex="${index===active?0:-1}" aria-selected="${index===active}" onclick="event.stopPropagation();selectTraceAsset('${layer}',${index})"><span>${esc(label)}</span><span class="close" aria-hidden="true">×</span></button>`}).join('');
 return `<div class="sourceTabs" role="tablist" aria-label="${layer} source files">${tabs}</div>${inlineSource(item)}`;
}
function gridTemplateStyle(){return `grid-template-columns:${gridRatios.cols.join('fr ')}fr;grid-template-rows:${gridRatios.rows.join('fr ')}fr`}
function gridSplitters(){
 const c1=gridRatios.cols[0],c2=c1+gridRatios.cols[1],r1=gridRatios.rows[0],r2=r1+gridRatios.rows[1];
 return `<div class="gridSplitter vertical" style="left:${c1}%" role="separator" aria-label="Resize first and second columns" aria-orientation="vertical" aria-valuenow="${c1}" tabindex="0" onpointerdown="startGridResize(event,'cols',0)" onkeydown="gridResizeKey(event,'cols',0)"><span>Resize columns</span></div><div class="gridSplitter vertical" style="left:${c2}%" role="separator" aria-label="Resize second and third columns" aria-orientation="vertical" aria-valuenow="${c2}" tabindex="0" onpointerdown="startGridResize(event,'cols',1)" onkeydown="gridResizeKey(event,'cols',1)"><span>Resize columns</span></div><div class="gridSplitter horizontal" style="top:${r1}%" role="separator" aria-label="Resize top and middle rows" aria-orientation="horizontal" aria-valuenow="${r1}" tabindex="0" onpointerdown="startGridResize(event,'rows',0)" onkeydown="gridResizeKey(event,'rows',0)"><span>Resize rows</span></div><div class="gridSplitter horizontal" style="top:${r2}%" role="separator" aria-label="Resize code and waveform rows" aria-orientation="horizontal" aria-valuenow="${r2}" tabindex="0" onpointerdown="startGridResize(event,'rows',1)" onkeydown="gridResizeKey(event,'rows',1)"><span>Resize rows</span></div>`;
}
function setGridBoundary(axis,boundary,percent){
 const values=gridRatios[axis],minimum=axis==='cols'?[22,20,18]:[24,20,18];
 if(boundary===0){const pair=values[0]+values[1],next=Math.max(minimum[0],Math.min(pair-minimum[1],percent));values[1]=pair-next;values[0]=next}
 else{const next=Math.max(values[0]+minimum[1],Math.min(100-minimum[2],percent));values[1]=next-values[0];values[2]=100-next}
 applyGridRatios();
}
function applyGridRatios(){
 const workspace=document.querySelector('.traceWorkspace');if(!workspace)return;
 workspace.style.gridTemplateColumns=gridRatios.cols.join('fr ')+'fr';workspace.style.gridTemplateRows=gridRatios.rows.join('fr ')+'fr';
 workspace.style.setProperty('--row1',gridRatios.rows[0]+'%');workspace.style.setProperty('--row2',gridRatios.rows[1]+'%');
 const splitters=workspace.querySelectorAll('.gridSplitter');if(splitters.length===4){splitters[0].style.left=gridRatios.cols[0]+'%';splitters[1].style.left=(gridRatios.cols[0]+gridRatios.cols[1])+'%';splitters[2].style.top=gridRatios.rows[0]+'%';splitters[3].style.top=(gridRatios.rows[0]+gridRatios.rows[1])+'%'}
}
function startGridResize(event,axis,boundary){
 event.preventDefault();const workspace=document.querySelector('.traceWorkspace'),rect=workspace.getBoundingClientRect();
 const move=ev=>{const percent=axis==='cols'?(ev.clientX-rect.left)/rect.width*100:(ev.clientY-rect.top)/rect.height*100;setGridBoundary(axis,boundary,percent)};
 const stop=()=>{window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',stop)};
 window.addEventListener('pointermove',move);window.addEventListener('pointerup',stop,{once:true});
}
function gridResizeKey(event,axis,boundary){
 const valid=axis==='cols'?['ArrowLeft','ArrowRight']:['ArrowUp','ArrowDown'];if(!valid.includes(event.key))return;
 event.preventDefault();const cumulative=boundary===0?gridRatios[axis][0]:gridRatios[axis][0]+gridRatios[axis][1],delta=(event.key==='ArrowRight'||event.key==='ArrowDown')?2:-2;setGridBoundary(axis,boundary,cumulative+delta);
}
function setNavigatorWidth(value){
 traceNavWidth=Math.max(160,Math.min(380,Math.round(value)));const shell=document.querySelector('.traceShell');if(!shell)return;
 shell.style.gridTemplateColumns=`${traceNavWidth}px minmax(0,1fr)`;const handle=shell.querySelector('.navWidthHandle');if(handle)handle.style.left=(traceNavWidth-4)+'px';
}
function startNavigatorResize(event){
 event.preventDefault();const shell=document.querySelector('.traceShell'),rect=shell.getBoundingClientRect();
 const move=ev=>setNavigatorWidth(ev.clientX-rect.left),stop=()=>{window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',stop)};
 window.addEventListener('pointermove',move);window.addEventListener('pointerup',stop,{once:true});
}
function navigatorResizeKey(event){if(!['ArrowLeft','ArrowRight'].includes(event.key))return;event.preventDefault();setNavigatorWidth(traceNavWidth+(event.key==='ArrowRight'?10:-10))}
function setCodeSplit(value){
 codeSplit=Math.max(22,Math.min(78,Math.round(value*10)/10));const row=document.querySelector('.codeRow');if(!row)return;
 row.style.gridTemplateColumns=`${codeSplit}fr ${100-codeSplit}fr`;const splitter=row.querySelector('.codeSplitter');if(splitter)splitter.style.left=codeSplit+'%';
}
function startCodeResize(event){
 event.preventDefault();const workspace=document.querySelector('.codeRow'),rect=workspace.getBoundingClientRect();
 const move=ev=>setCodeSplit((ev.clientX-rect.left)/rect.width*100),stop=()=>{window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',stop)};
 window.addEventListener('pointermove',move);window.addEventListener('pointerup',stop,{once:true});
}
function codeResizeKey(event){if(!['ArrowLeft','ArrowRight'].includes(event.key))return;event.preventDefault();setCodeSplit(codeSplit+(event.key==='ArrowRight'?2:-2))}
function behaviorFsm(req){
 const model=mvpCatalog.behavior_models?.find(m=>m.id===req.behavior_model?.model_id);
 if(!model)return '<div class="muted">Behavior model unavailable</div>';
 const activeIds=new Set(req.behavior_model.transition_ids),stateById=Object.fromEntries(model.states.map(s=>[s.id,s]));
 const activeStates=new Set(model.transitions.filter(t=>activeIds.has(t.id)).flatMap(t=>[t.from,t.to]));
 const nodes=model.states.map(s=>`<g><circle cx="${s.x}" cy="${s.y}" r="44" fill="${activeStates.has(s.id)?'#dcebff':'#f5f7fa'}" stroke="${activeStates.has(s.id)?'#2768ac':'#718399'}" stroke-width="${activeStates.has(s.id)?2:1.3}"/><text x="${s.x}" y="${s.y-3}" text-anchor="middle" font-size="12" font-weight="800" fill="#173151">${esc(s.label)}</text><text x="${s.x}" y="${s.y+14}" text-anchor="middle" font-size="8" fill="#526a84">${esc(s.invariant)}</text></g>`).join('');
 const arrows=model.transitions.map((t,index)=>{
  const from=stateById[t.from],to=stateById[t.to],active=activeIds.has(t.id),stroke=active?'#111827':'#8292a5',marker=active?'url(#fsmArrowActive)':'url(#fsmArrow)',opacity=active?1:.38;
  if(t.from===t.to){const side=from.x<150?-1:1,x1=from.x+side*30,y1=from.y-32,x2=from.x+side*44,y2=from.y+8,labelX=from.x+side*55,labelY=from.y-55-(t.id==='send_decrement'?12:0);return `<path d="M${x1},${y1} C${from.x+side*70},${from.y-75} ${from.x+side*75},${from.y+55} ${x2},${y2}" fill="none" stroke="${stroke}" stroke-width="${active?2.4:1.2}" opacity="${opacity}" marker-end="${marker}"/><text x="${labelX}" y="${labelY}" text-anchor="middle" font-size="8.5" fill="${stroke}" opacity="${opacity}">${esc(t.event)}</text>`}
  const direction=from.x<to.x?1:-1,startX=from.x+direction*44,endX=to.x-direction*44,curve=direction>0?-28:30,mid=(startX+endX)/2;return `<path d="M${startX},${from.y} Q${mid},${from.y+curve} ${endX},${to.y}" fill="none" stroke="${stroke}" stroke-width="${active?2.4:1.2}" opacity="${opacity}" marker-end="${marker}"/><text x="${mid}" y="${from.y+curve+(curve<0?-5:13)}" text-anchor="middle" font-size="8.5" font-weight="${active?800:400}" fill="${stroke}" opacity="${opacity}">${esc(t.event)}</text>`;
 }).join('');
 const selected=model.transitions.filter(t=>activeIds.has(t.id)).map(t=>`<div><b>${esc(t.id)}</b> · ${esc(t.guard)} → ${esc(t.action)}</div>`).join('');
 return `<div class="fsmSurface"><svg viewBox="0 0 440 225" role="img" aria-label="${esc(model.kind)}"><defs><marker id="fsmArrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#8292a5"/></marker><marker id="fsmArrowActive" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#111827"/></marker></defs>${arrows}${nodes}<text x="220" y="215" text-anchor="middle" font-size="8" fill="#687c91">counter-state abstraction · not an RTL control FSM</text></svg><div class="fsmLegend">${selected}</div></div>`;
}
function renderMvp(){
 setTitle('Trace Explorer','');
 document.querySelector('.topbar').classList.add('traceCompact');
 document.getElementById('quickJobBtn').style.display='none';
 const content=document.getElementById('content');
 if(!mvpCatalog&&!mvpLoading){content.innerHTML='<div class="card">Backend 연결 중…</div>';loadMvp();return}
 if(!mvpCatalog){content.innerHTML=`<div class="card">${mvpLoading?'Backend 연결 중…':esc(mvpError)}</div>`;return}
 const req=mvpCatalog.requirements.find(r=>r.id===mvpSelected)||mvpCatalog.requirements[0],run=mvpBundle?.run,status=run?.status||'NOT RUN';
 if(mvpSpecPage===null)mvpSpecPage=req.spec.pdf_pages[0];
 const golden=req.trace.golden[sourceTabIndex.golden]||req.trace.golden[0],rtl=req.trace.rtl[sourceTabIndex.rtl]||req.trace.rtl[0];
 selectionContext.trace_id=req.trace_id||req.id;selectionContext.clause=req.spec.clause;selectionContext.event=req.waveform.event_signal;
 content.innerHTML=`<div class="traceShell" style="grid-template-columns:${traceNavWidth}px minmax(0,1fr)">${traceNavigator(req)}<div class="navWidthHandle" style="left:${traceNavWidth-4}px" role="separator" aria-label="Resize Trace Navigator" aria-orientation="vertical" tabindex="0" onpointerdown="startNavigatorResize(event)" onkeydown="navigatorResizeKey(event)"></div><section class="traceWorkspace" style="${gridTemplateStyle()};--row1:${gridRatios.rows[0]}%;--row2:${gridRatios.rows[1]}%;--code-split:${codeSplit}%">
 <article class="dockPane specDock" id="specDock">${dockHead('SPEC','specDock')}<div class="dockBody">${traceSpecBody(req)}</div></article>
 <article class="dockPane fsmDock ${selectionContext.layer==='behavior'?'contextSelected':''}" id="fsmDock">${dockHead('BEHAVIOR','fsmDock')}<div class="dockBody" onclick="selectTraceLayer('behavior')">${behaviorFsm(req)}</div></article>
 <article class="dockPane propertyDock" id="propertyDock">${dockHead('TRACE PROPERTIES','propertyDock')}<div class="dockBody"><div class="qaEntry"><span class="qaContext"><b>${esc(req.title)}</b><small>ECSS §${esc(req.spec.clause)}</small></span><button class="btn qaButton" aria-label="Ask AI about ${esc(req.id)}" onclick="openMvpQa()"><span class="qaIcon" aria-hidden="true">✦</span>Ask AI</button></div><dl class="traceProperties"><dt>trace_id</dt><dd>${esc(selectionContext.trace_id)}</dd><dt>clause</dt><dd>ECSS §${esc(selectionContext.clause)}</dd><dt>title</dt><dd>${esc(req.title)}</dd><dt>selected</dt><dd>${esc(selectionContext.layer)}${selectionContext.symbol?` · ${esc(selectionContext.symbol)}`:''}</dd><dt>event</dt><dd>${esc(selectionContext.event)}</dd><dt>latest</dt><dd><span class="badge ${status==='PASS'?'good':status==='FAIL'?'bad':'neutral'}">${status}</span></dd></dl><h4>Executable behavior</h4><div class="callout"><b>Trigger:</b> ${esc(req.behavior.trigger)}<br><b>Expected:</b> ${esc(req.behavior.expected)}</div></div></article>
 <div class="codeRow" style="grid-template-columns:${codeSplit}fr ${100-codeSplit}fr"><article class="dockPane goldenDock ${selectionContext.layer==='golden'?'contextSelected':''}" id="goldenDock">${dockHead('GOLDEN','goldenDock',esc(golden.symbol))}<div class="dockBody sourceDockBody" onclick="selectTraceAsset('golden',${sourceTabIndex.golden})">${sourcePane('golden',req)}</div></article>
 <article class="dockPane rtlDock ${selectionContext.layer==='rtl'?'contextSelected':''}" id="rtlDock">${dockHead('RTL','rtlDock',esc(rtl.symbol))}<div class="dockBody sourceDockBody" onclick="selectTraceAsset('rtl',${sourceTabIndex.rtl})">${sourcePane('rtl',req)}</div></article><div class="codeSplitter" style="left:${codeSplit}%" role="separator" aria-label="Resize Golden and RTL" aria-orientation="vertical" tabindex="0" onpointerdown="startCodeResize(event)" onkeydown="codeResizeKey(event)"></div></div>
 <article class="dockPane waveDock" id="waveDock">${dockHead('WAVE','waveDock',esc(req.waveform.annotation))}<div class="dockBody">${waveHtml(mvpBundle?.waveform,req.waveform)}</div></article>
 ${gridSplitters()}</section></div>`;
 if(!mvpSourceCache[sourceKey(golden)]||!mvpSourceCache[sourceKey(rtl)])loadTraceSources(req);
}
function renderMvpRun(){
 setTitle('Verification Run','Execute Golden regression, RTL compile and simulation; inspect logs and artifacts');
 document.getElementById('quickJobBtn').style.display='none';
 const content=document.getElementById('content');
 if(!mvpCatalog&&!mvpLoading){content.innerHTML='<div class="card">Backend 연결 중…</div>';loadMvp();return}
 if(!mvpCatalog){content.innerHTML=`<div class="card">${mvpLoading?'Backend 연결 중…':esc(mvpError)}</div>`;return}
 const req=mvpCatalog.requirements.find(r=>r.id===mvpSelected)||mvpCatalog.requirements[0],run=mvpBundle?.run,status=run?.status||'NOT RUN';
 content.innerHTML=`<div class="runShell"><div class="runNotice"><div><b>Selected trace: ${esc(req.trace_id||req.id)}</b><div class="runTraceContext">ECSS §${esc(req.spec.clause)} · event=${esc(req.waveform.event_signal)}</div></div><button class="btn" onclick="go('mvp')">Back to Trace Explorer</button></div><div class="card"><h3>Execute / Result</h3><div class="executeHead"><button class="btn primary" ${mvpBusy?'disabled':''} onclick="executeMvp()">${mvpBusy?'Running…':'Run Golden + RTL Test'}</button><span class="badge ${status==='PASS'?'good':status==='FAIL'?'bad':'neutral'}">${status}</span><span class="muted">${run?`${esc(run.run_id)} · ${run.summary.passed}/${run.summary.total} PASS · ${run.duration_seconds}s`:'실행 결과 없음'}</span></div>${mvpError?`<div class="callout bad">${esc(mvpError)}</div>`:''}<div class="mvpTabs">${[['summary','Summary'],['golden','Golden'],['compile','Compile'],['simulation','Simulation'],['stdout','stdout.log']].map(([id,label])=>`<button class="${mvpTab===id?'active':''}" onclick="mvpTab='${id}';renderMvpRun()">${label}</button>`).join('')}</div><div class="mvpTabPane">${executePane(run)}</div></div><div class="evidenceGrid"><div class="card"><h3>WAVE · ${esc(req.id)}</h3>${waveHtml(mvpBundle?.waveform,req.waveform)}</div><div class="card"><h3>Test Evidence · ${esc(req.id)}</h3>${testEvidence(req,run)}</div></div></div>`;
}

function render(){
 document.querySelector('.topbar').classList.remove('traceCompact');
 document.getElementById('quickJobBtn').style.display='';
 const map={mvp:renderMvp,'mvp-run':renderMvpRun,dashboard:renderDashboard,spec:renderSpec,req:renderReq,golden:renderGolden,diagram:renderDiagram,arch:renderArch,uarch:renderUarch,rtl:renderRTL,verify:renderVerify,trace:renderTrace,decision:renderDecision};
 map[state.page]();
}
window.go=p=>{
 state.page=p;
 document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));
 render();
};
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>go(b.dataset.page));

const globalSearch=document.getElementById('globalSearch');
if(globalSearch)globalSearch.addEventListener('keydown',e=>{
 if(e.key!=='Enter')return;
 const q=e.target.value.trim().toLowerCase();
 const req=requirements.find(r=>r.id.toLowerCase().includes(q)||r.title.toLowerCase().includes(q));
 const clause=clauses.find(c=>c.id.toLowerCase().includes(q)||c.title.toLowerCase().includes(q));
 if(req){state.selectedReq=req.id;go('req');toast(req.id+'로 이동');}
 else if(clause){state.selectedClause=clause.id;go('spec');toast(clause.id+'로 이동');}
 else if(q.includes('credit')){state.selectedReq='REQ-ENC-024';go('req');toast('credit 관련 Requirement 표시');}
 else toast('Mock dataset에서 검색 결과가 없습니다.');
});
render();
</script>
